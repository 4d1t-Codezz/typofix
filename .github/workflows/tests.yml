name: tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        python: ["3.11", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Run tests
        run: python -m unittest discover -s tests -t . -v
      - name: Load this OS's keyboard backend
        run: python -c "from typofix.platforms import get_backend; b = get_backend(); print(b.name, b.KeyHook)"
      - name: Start the whole app (window, bubble, tray icon) and quit
        run: python tests/smoke_app.py
        timeout-minutes: 2
